[project]
name = "ai-code-decoder"
version = "0.1.0"
description = "AI가 짜 준 코드의 흐름과 설계 결정을 학습하는 웹앱 (FastAPI + OpenAI Agents SDK)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=42",
  "fastapi>=0.115,<1",
  "mcp>=2.3,<3",
  "openai-agents>=0.24,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
  "uvicorn[standard]>=0.32,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
# 골든 샘플은 분석 대상 코드(데이터)라 린트하지 않는다.
extend-exclude = [".venv", "node_modules", "dist", "evals/golden/samples"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "T20", "N"]

[tool.ruff.lint.isort]
known-first-party = ["server"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T20"]
"evals/golden/__main__.py" = ["T20"]
# 프롬프트 문장은 줄을 나누면 읽기 어려워 길이 제한에서 뺀다.
"server/agents/prompts.py" = ["E501"]
