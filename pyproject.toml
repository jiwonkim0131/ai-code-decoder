[project]
name = "ai-code-decoder"
version = "0.1.0"
description = "AI가 짜 준 코드의 흐름과 설계 결정을 학습하는 웹앱 (FastAPI + OpenAI Agents SDK)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "openai-agents>=0.24,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
  "uvicorn[standard]>=0.32,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "node_modules", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "T20", "N"]

[tool.ruff.lint.isort]
known-first-party = ["server"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T20"]
